<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duas and Aamal – Download the App</title>
  <meta name="description" content="Duas and Aamal: The ultimate Islamic app for Duas, Ziyarat, and Amaal. Download now for iOS and Android.">

  <!-- Google Fonts for modern look -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- App Icon -->
  <link rel="icon" href="https://play-lh.googleusercontent.com/M3grOyaXhH0qR39y5pR1JcJ0mWJI5VC2pirJt3kFA6Sla77poFVNnObTGpRJWvH_SQ" type="image/png">

  <style>
    :root {
      --bg: #f8f2e3;
      --primary: #313f65;
      --accent: #76481e;
      --secondary: #f9c846;
      --radius: 32px;
      --shadow: 0 8px 32px rgba(49, 63, 101, 0.10), 0 1.5px 6px rgba(118, 72, 30, 0.06);
      --gold: #f9c846;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--primary);
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .hero-bg {
      width: 100vw;
      min-height: 100vh;
      background: radial-gradient(ellipse at 60% 0%, #fffbe9 60%, #f8f2e3 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-bottom: 48px;
    }
    .fallback-2col {
      width: 100%;
      max-width: 1100px;
      margin: 56px auto 0 auto;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: center;
      padding: 0;
      overflow: hidden;
      min-height: 600px;
    }
    .col-left {
      flex: 1 1 420px;
      min-width: 320px;
      max-width: 480px;
      background: linear-gradient(120deg, #fffbe9 60%, #f8f2e3 100%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 56px 40px 48px 56px;
      box-sizing: border-box;
    }
    .app-logo {
      width: 110px;
      height: 110px;
      border-radius: 28%;
      box-shadow: 0 4px 18px rgba(49, 63, 101, 0.10);
      margin-bottom: 18px;
      object-fit: cover;
      background: #eee;
      border: 3px solid #fff;
      display: block;
    }
    h1 {
      font-size: 2.3rem;
      font-weight: 700;
      margin: 0 0 10px 0;
      color: var(--accent);
      letter-spacing: -1px;
      text-align: left;
    }
    .tagline {
      font-size: 1.18rem;
      color: var(--primary);
      margin-bottom: 18px;
      text-align: left;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .store-buttons {
      display: flex;
      justify-content: flex-start;
      gap: 18px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .store-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
      border-radius: 14px;
      transition: box-shadow 0.2s, transform 0.2s;
      box-shadow: 0 2px 8px #f3e6d2;
      background: #fff;
    }
    .store-btn:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 6px 18px #f3e6d2;
      background: #f8f2e3;
    }
    .store-btn img {
      height: 56px;
      width: auto;
      display: block;
    }
    .features {
      margin: 0 0 18px 0;
      color: var(--primary);
      font-size: 1.09rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-start;
      width: 100%;
      max-width: 370px;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.09rem;
      color: var(--primary);
      background: #fffbe9;
      border-radius: 12px;
      padding: 8px 16px;
      box-shadow: 0 1px 4px #f3e6d2;
    }
    .feature-icon {
      color: var(--secondary);
      font-size: 1.3em;
      font-weight: bold;
      margin-right: 2px;
    }
    .footer {
      font-size: 0.98rem;
      color: #bfa77a;
      margin-top: 18px;
      text-align: left;
    }
    .footer a {
      color: var(--accent);
      text-decoration: underline;
      margin: 0 4px;
    }
    .col-right {
      flex: 1 1 0;
      min-width: 0;
      background: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 48px 32px 48px 32px;
      box-sizing: border-box;
      width: 100%;
    }
    .screenshot-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    .screenshot {
      width: 100%;
      max-width: 400px;
      max-height: 650px;
      object-fit: contain;
      border-radius: 32px;
      box-shadow: 0 12px 40px 0 #e6d7c2;
      background: #f3f3f3;
      display: block;
      border: 2px solid #f8f2e3;
    }
    /* Responsive styles */
    @media (max-width: 1100px) {
      .fallback-2col { max-width: 98vw; }
      .col-left, .col-right { max-width: 100%; padding: 40px 4vw; }
      .screenshot { max-width: 98vw; }
    }
    @media (max-width: 900px) {
      .fallback-2col { flex-direction: column; max-width: 99vw; min-height: unset; }
      .col-left, .col-right { padding: 32px 4vw; }
      .col-left { align-items: center; text-align: center; }
      h1, .tagline, .footer { text-align: center; }
      .store-buttons { justify-content: center; }
      .features { align-items: center; }
      .screenshot { max-width: 90vw; }
    }
    @media (max-width: 600px) {
      .fallback-2col { border-radius: 0; margin: 0; }
      .col-left, .col-right { padding: 18px 2vw; }
      .screenshot { max-width: 98vw; }
      .features, .screenshot-wrap { max-width: 98vw; }
      .app-logo { width: 80px; height: 80px; }
      h1 { font-size: 1.5rem; }
      .tagline { font-size: 1rem; }
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <script>
    // --- CONFIGURE YOUR LINKS HERE ---
    const LINKS = {
      ios: "https://apps.apple.com/us/app/duas-and-aamal/id6478907381",
      android: "https://play.google.com/store/apps/details?id=app.duasandaamal.com&hl=en"
    };

    // Platform detection
    function getPlatform() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      if (/android/i.test(ua)) return "android";
      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "ios";
      // iPadOS 13+ in desktop mode
      if (/Macintosh/.test(ua) && 'ontouchend' in document) return "ios";
      return "desktop";
    }

    // UTM params
    function getUtmParams() {
      const params = new URLSearchParams(window.location.search);
      const utms = {};
      params.forEach((v, k) => {
        if (k.startsWith("utm_")) utms[k] = v;
      });
      return utms;
    }
    function appendUtms(url, utms) {
      if (!utms || Object.keys(utms).length === 0) return url;
      const u = new URL(url);
      for (const [k, v] of Object.entries(utms)) {
        u.searchParams.set(k, v);
      }
      return u.toString();
    }

    // Redirect for mobile, show page for desktop
    function handlePage() {
      const platform = getPlatform();
      const utms = getUtmParams();
      if (platform === "android" || platform === "ios") {
        const target = LINKS[platform];
        const finalUrl = appendUtms(target, utms);
        window.location.href = finalUrl;
      } else {
        document.getElementById("fallback-2col").style.display = "flex";
      }
    }
    window.addEventListener("DOMContentLoaded", handlePage);
  </script>
</head>

        </div>
        <div class="footer">
          &copy; 2025 Duas and Aamal.<br>
          <a href="https://play.google.com/store/apps/details?id=app.duasandaamal.com&hl=en" target="_blank" rel="noopener">Google Play</a> &
          <a href="https://apps.apple.com/us/app/duas-and-aamal/id6478907381" target="_blank" rel="noopener" style="color:var(--accent);">App Store</a>
        </div>
      </div>
      <div class="col-right">

</body>
